version: '3.9'

services:
  backend:
    build:
      context: ./backend
    container_name: amplifii-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - ALLOWED_ORIGIN=http://localhost:5173
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:3001
    container_name: amplifii-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
