[project]
name = "amplifii-tests"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "pytest>=7.4.0",
    "pytest-playwright>=0.4.0",
    "axe-playwright-python>=0.1.0",
    "pytest-html>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["specs"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
